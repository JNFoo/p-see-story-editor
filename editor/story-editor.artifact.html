<script type="application/json" id="starter-story">
{"format":"story-editor","version":1,"id":"s_keepers_light","title":"The Keeper’s Light","author":"","start":"p_start","items":[{"id":"i_lantern","name":"Lantern","kind":"object","show":true},{"id":"i_key","name":"Spare key","kind":"object","show":true},{"id":"i_oil","name":"Can of oil","kind":"object","show":true},{"id":"i_flare","name":"Flare pistol","kind":"object","show":true},{"id":"i_dark","name":"Hooded lamp doused","kind":"state","show":false},{"id":"i_pell","name":"Dealt with Pell","kind":"state","show":false},{"id":"i_barred","name":"Door barred","kind":"state","show":false}],"passages":[{"id":"p_start","name":"Start","heading":"","ending":false,"valence":"","blocks":[{"text":"The supply boat noses away from Gull Rock and the fog closes behind it like a door. You have come to relieve the keeper for the winter, and the great lamp above you should be turning. It is dark.","needs":[],"forbid":[],"orPrev":false},{"text":"The lighthouse door stands open a hand’s width. No window is lit. You have a duffel, a box of matches, and nobody to ask.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[{"label":"Push the door open and go in","to":"p_hall","needs":[],"forbid":[]},{"label":"Walk the shoreline first","to":"p_shore","needs":[],"forbid":[]}]},{"id":"p_shore","name":"Shore","heading":"","ending":false,"valence":"","blocks":[{"text":"The rocks are wet and loud with waves. A line of bootprints climbs toward a set of cliff steps, and a tin-roofed shed squats beside the landing.","needs":[],"forbid":[],"orPrev":false},{"text":"Near the tide line a hurricane lantern lies on its side, still faintly warm.","needs":[],"forbid":["i_lantern"],"orPrev":false},{"text":"You hold the lantern in front of you. Its small flame makes the fog glow.","needs":[],"forbid":[],"orPrev":true}],"gives":[],"takes":[],"choices":[{"label":"Pick up the lantern","to":"p_take_lantern","needs":[],"forbid":["i_lantern"]},{"label":"Look inside the tin shed","to":"p_shed","needs":[],"forbid":[]},{"label":"Follow the bootprints up the cliff steps","to":"p_cliff","needs":[],"forbid":[]},{"label":"Go to the lighthouse door","to":"p_hall","needs":[],"forbid":[]}]},{"id":"p_take_lantern","name":"Take lantern","heading":"","ending":false,"valence":"","blocks":[{"text":"You right the lantern and shake it. There is oil in it still. A match later the flame stands up small and steady, and the fog around you turns to gold.","needs":[],"forbid":[],"orPrev":false},{"text":"Whoever dropped it left in a hurry.","needs":[],"forbid":[],"orPrev":false}],"gives":["i_lantern"],"takes":[],"choices":[{"label":"Look around the rocks again","to":"p_shore","needs":[],"forbid":[]}]},{"id":"p_shed","name":"Shed","heading":"","ending":false,"valence":"","blocks":[{"text":"The shed smells of tar and rust. A fog bell hangs from a beam with its rope cut short. On a shelf, behind a coil of line, sits a red box with EMERGENCY stenciled on the lid.","needs":[],"forbid":[],"orPrev":false},{"text":"The lid is not locked.","needs":[],"forbid":["i_flare"],"orPrev":false},{"text":"The red box stands open and empty now.","needs":[],"forbid":[],"orPrev":true}],"gives":[],"takes":[],"choices":[{"label":"Open the red box","to":"p_take_flare","needs":[],"forbid":["i_flare"]},{"label":"Step back out onto the rocks","to":"p_shore","needs":[],"forbid":[]}]},{"id":"p_take_flare","name":"Take flare","heading":"","ending":false,"valence":"","blocks":[{"text":"Inside, wrapped in oilcloth, are a flare pistol and one fat red cartridge. It is cold and heavier than it looks. You tuck it into your coat, where it knocks against your ribs.","needs":[],"forbid":[],"orPrev":false}],"gives":["i_flare"],"takes":[],"choices":[{"label":"Go back out to the landing","to":"p_shore","needs":[],"forbid":[]}]},{"id":"p_cliff","name":"Cliff","heading":"","ending":false,"valence":"","blocks":[{"text":"The cliff steps end at a ledge of wet grass, with the open sea gray and quiet beyond it.","needs":[],"forbid":[],"orPrev":false},{"text":"Below the ledge the mooring post stands bare, a cut rope trailing in the black water.","needs":["i_pell"],"forbid":[],"orPrev":false},{"text":"Below the ledge a slipway runs down to a pocket of calm water, where a rowboat is tied to an iron post, oars shipped. Nobody is guarding it.","needs":[],"forbid":[],"orPrev":true},{"text":"Farther along the edge a man stands beside a tall pole, and he has already turned toward your lantern. A hooded lamp hangs from the pole, burning steady and bright, aimed out to sea. In fog, with the great lamp dark, a captain might take it for a harbor light.","needs":["i_lantern"],"forbid":["i_pell","i_dark"],"orPrev":false},{"text":"Farther along the edge a man stands beside a tall pole. The hooded lamp on it has gone dark. He is peering up at it, and then he sees your lantern.","needs":["i_lantern","i_dark"],"forbid":["i_pell"],"orPrev":true},{"text":"Farther along the edge a man sits with his back to you beside a tall pole. A hooded lamp hangs from it, burning steady and bright, aimed out to sea. He has not looked round. In fog, with the great lamp dark, a captain might take that lamp for a harbor light.","needs":[],"forbid":["i_lantern","i_pell","i_dark"],"orPrev":true},{"text":"Farther along the edge a man sits with his back to you beside a tall pole. The hooded lamp on it is dark. He has not looked round, or noticed.","needs":["i_dark"],"forbid":["i_lantern","i_pell"],"orPrev":true},{"text":"The pole at the edge stands alone now, its hooded lamp still burning, aimed out to sea.","needs":["i_pell"],"forbid":["i_dark"],"orPrev":true},{"text":"The pole at the edge stands alone now, its hooded lamp dark.","needs":["i_pell","i_dark"],"forbid":[],"orPrev":true}],"gives":[],"takes":[],"choices":[{"label":"Slip the mooring and row away","to":"p_end_flee","needs":[],"forbid":["i_lantern","i_pell"]},{"label":"Creep up to the pole and pinch out the lamp","to":"p_cliff_douse","needs":[],"forbid":["i_lantern","i_dark","i_pell"]},{"label":"Put out the lamp on the pole","to":"p_cliff_douse","needs":["i_pell"],"forbid":["i_dark"]},{"label":"Walk toward the man, lantern raised","to":"p_cliff_pell","needs":["i_lantern"],"forbid":["i_pell"]},{"label":"Go back down to the rocks","to":"p_shore","needs":[],"forbid":[]}]},{"id":"p_cliff_douse","name":"Cliff douse","heading":"","ending":false,"valence":"","blocks":[{"text":"You reach up, lift the hood, and pinch the wick out between a wet finger and thumb. The light dies with a small hiss.","needs":["i_pell"],"forbid":[],"orPrev":false},{"text":"You keep low and keep the fog between you and the man. He is humming to himself and does not turn. You reach the pole in four steps, lift the hood, and pinch the wick out between a wet finger and thumb. The light dies with a small hiss. The humming stops. Then it starts again. He thinks the wind did it.","needs":[],"forbid":[],"orPrev":true},{"text":"Out in the dark, a long way off, a ship’s horn sounds, uncertain, as if it has just lost something.","needs":[],"forbid":[],"orPrev":false}],"gives":["i_dark"],"takes":[],"choices":[{"label":"Go back to the ledge","to":"p_cliff","needs":[],"forbid":[]}]},{"id":"p_cliff_pell","name":"Cliff pell","heading":"","ending":false,"valence":"","blocks":[{"text":"The man waits until you are close, then smiles with half his face. “Relief, is it?” he says. “They told me you wouldn’t come till Thursday.” One hand stays in his coat.","needs":[],"forbid":[],"orPrev":false},{"text":"“Name’s Pell. Nobody needs to be hurt tonight. By morning there’ll be a wreck on the Rock, and a share in it for anyone who minds his own business.” His eyes drop to your sleeve, where cellar rope has left gray fuzz, and lift again. “I see you’ve met the old man. Well. That needn’t change anything.”","needs":["i_key"],"forbid":[],"orPrev":false},{"text":"“Name’s Pell. Nobody needs to be hurt tonight. By morning there’ll be a wreck on the Rock, and a share in it for anyone who minds his own business.”","needs":[],"forbid":["i_key"],"orPrev":false}],"gives":[],"takes":[],"choices":[{"label":"Hear what he is offering","to":"p_cliff_deal","needs":[],"forbid":[]},{"label":"Swing the lantern at him and shove him down the slipway","to":"p_cliff_fight","needs":[],"forbid":[]},{"label":"Back away down the steps","to":"p_shore","needs":[],"forbid":[]}]},{"id":"p_cliff_deal","name":"Cliff deal","heading":"","ending":false,"valence":"","blocks":[{"text":"“One share in five,” says Pell. “You sit in the keeper’s hall and drink his tea and you never saw a thing. By dawn you’ll have more silver than a keeper sees in ten years.” He holds out a closed fist. Something clinks inside it.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[{"label":"Take his hand","to":"p_end_bought","needs":[],"forbid":[]},{"label":"Refuse. Swing the lantern and shove him","to":"p_cliff_fight","needs":[],"forbid":[]},{"label":"Say nothing and back away down the steps","to":"p_shore","needs":[],"forbid":[]}]},{"id":"p_cliff_fight","name":"Cliff fight","heading":"","ending":false,"valence":"","blocks":[{"text":"You swing the lantern low and wide, so the light jerks across his eyes, and drive your shoulder into his chest. Pell goes backward down the slipway and lands hard in the rowboat.","needs":[],"forbid":[],"orPrev":false},{"text":"Before he can find his feet you have the mooring rope off its post. The tide takes the boat, and Pell with it, out into the fog, cursing in a voice that gets smaller and smaller until the fog takes that too. The lantern, somehow, is still burning.","needs":[],"forbid":[],"orPrev":false}],"gives":["i_pell"],"takes":[],"choices":[{"label":"Catch your breath on the ledge","to":"p_cliff","needs":[],"forbid":[]}]},{"id":"p_hall","name":"Hall","heading":"","ending":false,"valence":"","blocks":[{"text":"The entry hall smells of lamp oil and cold stone. A logbook lies open on the keeper’s table. Stairs spiral up the tower wall, a low door stands beside them, and a trapdoor in the floor leads down to the cellar.","needs":[],"forbid":[],"orPrev":false},{"text":"Under your feet, very faintly, something is knocking.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[{"label":"Read the logbook","to":"p_logbook","needs":[],"forbid":[]},{"label":"Climb the tower stairs","to":"p_stairs","needs":[],"forbid":[]},{"label":"Try the low door beside the stairs","to":"p_store","needs":[],"forbid":[]},{"label":"Climb down through the trapdoor","to":"p_cellar","needs":["i_lantern"],"forbid":[]},{"label":"Peer down through the trapdoor","to":"p_cellar_dark","needs":[],"forbid":["i_lantern"]},{"label":"Step back outside","to":"p_shore","needs":[],"forbid":[]}]},{"id":"p_logbook","name":"Logbook","heading":"","ending":false,"valence":"","blocks":[{"text":"The last entry is written in a shaky hand.","needs":[],"forbid":[],"orPrev":false},{"text":"“Men came by boat at noon. They want the light dark tonight, so a ship will break up on the rocks and they can pick through the wreck. One of them is to stay up on the cliff with a false light, to draw her in. They locked me in the cellar and took the lamp room key. I still have the spare, in my boot. They poured out the lamp oil, but I hid a can in the store under the stairs. If anyone finds this, bring a lantern. It is black as pitch down here.”","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[{"label":"Close the book","to":"p_hall","needs":[],"forbid":[]}]},{"id":"p_store","name":"Store","heading":"","ending":false,"valence":"","blocks":[{"text":"By lantern light the store is a narrow room of coiled rope, empty drums and sacks of sawdust. Behind the sacks, where a careful person might find it, sits a blue can with a stopper wired in place.","needs":["i_lantern"],"forbid":["i_oil"],"orPrev":false},{"text":"By lantern light the store is a narrow room of coiled rope, empty drums and sacks of sawdust. You have already taken the only thing in it worth taking.","needs":["i_lantern","i_oil"],"forbid":[],"orPrev":true},{"text":"The store is as black as the inside of a boot. You feel rope, a cold drum, a sack that gives under your hand. If there is anything useful in here, you will not find it without a light.","needs":[],"forbid":["i_lantern"],"orPrev":true}],"gives":[],"takes":[],"choices":[{"label":"Take the blue can","to":"p_take_oil","needs":["i_lantern"],"forbid":["i_oil"]},{"label":"Go back to the hall","to":"p_hall","needs":[],"forbid":[]}]},{"id":"p_take_oil","name":"Take oil","heading":"","ending":false,"valence":"","blocks":[{"text":"The can is heavy and sloshes sweetly. Lamp oil, the good kind, enough to fill a reservoir and burn till dawn. You carry it out with both hands.","needs":[],"forbid":[],"orPrev":false}],"gives":["i_oil"],"takes":[],"choices":[{"label":"Go back to the hall","to":"p_hall","needs":[],"forbid":[]}]},{"id":"p_cellar_dark","name":"Cellar dark","heading":"","ending":false,"valence":"","blocks":[{"text":"You lower one foot onto the ladder and the dark swallows it. The knocking comes again, closer now, patient, like someone who has been at it for hours. Without a light you would be climbing down blind.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[{"label":"Climb back up","to":"p_hall","needs":[],"forbid":[]}]},{"id":"p_cellar","name":"Cellar","heading":"","ending":false,"valence":"","blocks":[{"text":"The ladder ends in a low stone cellar. By lantern light you find the keeper sitting against a barrel, his beard gray with damp.","needs":[],"forbid":[],"orPrev":false},{"text":"A rope ties his wrist to an iron ring. He nods toward his boot. “Spare key,” he whispers. “Cut me loose and take it.”","needs":[],"forbid":["i_key"],"orPrev":false},{"text":"He is on his feet now, rubbing his wrist and testing his knees. “Go on,” he says. “The ship will be here within the hour.”","needs":[],"forbid":[],"orPrev":true}],"gives":[],"takes":[],"choices":[{"label":"Cut him loose and take the spare key","to":"p_free_keeper","needs":[],"forbid":["i_key"]},{"label":"Climb back up","to":"p_hall","needs":[],"forbid":[]}]},{"id":"p_free_keeper","name":"Free keeper","heading":"","ending":false,"valence":"","blocks":[{"text":"The rope parts under your knife. The keeper pulls off his boot and tips a small brass key into your palm, then works his stiff fingers open and shut.","needs":[],"forbid":[],"orPrev":false},{"text":"“Ames,” he says. “Thank you. Listen. There’s a man on the cliff called Pell with a lamp he shouldn’t have. If you can put it out, do. The great lamp has no oil in it. They saw to that, but I hid a can in the store. And if you light it, Pell will know within a minute and come straight up the stairs. There’s an iron bar for that door.” He gets one foot under him and winces. “Go on. I’ll follow as these knees allow.”","needs":[],"forbid":[],"orPrev":false}],"gives":["i_key"],"takes":[],"choices":[{"label":"Climb back up to the hall","to":"p_hall","needs":[],"forbid":[]}]},{"id":"p_stairs","name":"Stairs","heading":"","ending":false,"valence":"","blocks":[{"text":"A hundred and twelve steps spiral up to a heavy oak door with a brass lock. Through the wall you can hear the ship’s horn out in the fog, low and worried. Far below, you hear Ames starting up after you, one hand sliding along the wall.","needs":["i_key"],"forbid":[],"orPrev":false},{"text":"A hundred and twelve steps spiral up to a heavy oak door with a brass lock. Through the wall you can hear the ship’s horn out in the fog, low and worried.","needs":[],"forbid":["i_key"],"orPrev":false}],"gives":[],"takes":[],"choices":[{"label":"Unlock the door with the spare key","to":"p_lamp","needs":["i_key"],"forbid":[]},{"label":"Throw your shoulder against the door","to":"p_stairs_locked","needs":[],"forbid":["i_key"]},{"label":"Go back down","to":"p_hall","needs":[],"forbid":[]}]},{"id":"p_stairs_locked","name":"Stairs locked","heading":"","ending":false,"valence":"","blocks":[{"text":"The door is solid oak. Your shoulder will be bruised in the morning and the door will not have noticed.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[{"label":"Step back from the door","to":"p_stairs","needs":[],"forbid":[]}]},{"id":"p_lamp","name":"Lamp","heading":"","ending":false,"valence":"","blocks":[{"text":"The lamp room is all glass and brass, with the great lens cold and dark in the middle. Beyond the glass the fog glows a faint gray. The ship’s horn sounds again, much nearer. Under it you can hear surf breaking on the rocks.","needs":[],"forbid":[],"orPrev":false},{"text":"The blue can of oil sits beside the lens pedestal. Ames has made the last of the stairs behind you and stands holding the doorframe, getting his breath. The iron bar lies across the door.","needs":["i_oil","i_barred"],"forbid":[],"orPrev":false},{"text":"The blue can of oil sits beside the lens pedestal. Ames has made the last of the stairs behind you and stands holding the doorframe, getting his breath. The iron bar hangs on its hooks by the door.","needs":["i_oil"],"forbid":["i_barred"],"orPrev":false},{"text":"The reservoir under the lens is bone dry. Ames has made the last of the stairs behind you and stands holding the doorframe, getting his breath. The iron bar lies across the door.","needs":["i_barred"],"forbid":["i_oil"],"orPrev":false},{"text":"The reservoir under the lens is bone dry. Ames has made the last of the stairs behind you and stands holding the doorframe, getting his breath. The iron bar hangs on its hooks by the door.","needs":[],"forbid":["i_oil","i_barred"],"orPrev":false}],"gives":[],"takes":[],"choices":[{"label":"Fill the reservoir and light the great lamp","to":"p_lamp_light","needs":["i_oil"],"forbid":[]},{"label":"Try to light the great lamp","to":"p_lamp_dry","needs":[],"forbid":["i_oil"]},{"label":"Drop the iron bar across the door","to":"p_lamp_bar","needs":[],"forbid":["i_barred"]},{"label":"Lift the bar and go back down","to":"p_lamp_unbar","needs":["i_barred"],"forbid":[]},{"label":"Go back down the stairs","to":"p_stairs","needs":[],"forbid":["i_barred"]},{"label":"Swing the lantern from the balcony rail","to":"p_end_signal","needs":[],"forbid":[]},{"label":"Fire the red flare from the balcony","to":"p_end_flare","needs":["i_flare"],"forbid":[]},{"label":"Sit down. You have done enough","to":"p_end_sleep","needs":[],"forbid":[]}]},{"id":"p_lamp_dry","name":"Lamp dry","heading":"","ending":false,"valence":"","blocks":[{"text":"You hold the lantern’s flame to the wick and nothing takes. The reservoir is dry. Somebody poured the oil out on purpose, and the keeper said he had hidden a spare can. It is not up here.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[{"label":"Step back from the lens","to":"p_lamp","needs":[],"forbid":[]}]},{"id":"p_lamp_bar","name":"Lamp bar","heading":"","ending":false,"valence":"","blocks":[{"text":"You lift the iron bar from its hooks and drop it across the door. It settles into its brackets with a sound like a cell closing. Ames nods once, as if you had passed a test. Whoever comes up those stairs will have to get through oak and iron.","needs":[],"forbid":[],"orPrev":false}],"gives":["i_barred"],"takes":[],"choices":[{"label":"Turn back to the lamp","to":"p_lamp","needs":[],"forbid":[]}]},{"id":"p_lamp_unbar","name":"Lamp unbar","heading":"","ending":false,"valence":"","blocks":[{"text":"You lift the bar from its brackets and lean it against the wall. The door opens onto the dark spiral of the stairs.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":["i_barred"],"choices":[{"label":"Start down","to":"p_stairs","needs":[],"forbid":[]}]},{"id":"p_lamp_light","name":"Lamp light","heading":"","ending":false,"valence":"","blocks":[{"text":"You pour the oil into the reservoir, trim the wick, and touch your lantern’s flame to it. The wick catches. The great lens gathers the little fire and throws it across the water in a long white arm, and the whole gallery fills with light.","needs":[],"forbid":[],"orPrev":false},{"text":"There is nobody left on the cliff to notice.","needs":["i_pell"],"forbid":[],"orPrev":false},{"text":"Down on the cliff, a man swears, loudly, and then you hear him running. Far below, a door slams.","needs":[],"forbid":[],"orPrev":true}],"gives":[],"takes":[],"choices":[{"label":"Watch the ship from the glass","to":"p_ship_check","needs":["i_pell"],"forbid":[]},{"label":"Listen at the door","to":"p_pell_hammers","needs":["i_barred"],"forbid":["i_pell"]},{"label":"Turn as the door bursts open","to":"p_end_taken","needs":[],"forbid":["i_pell","i_barred"]}]},{"id":"p_pell_hammers","name":"Pell hammers","heading":"","ending":false,"valence":"","blocks":[{"text":"Boots pound up the spiral, fast, and then fists hit the oak. “Open it!” It is Pell, and he is not asking. He throws his weight against the door once, twice, three times. The bar holds. The wood groans and holds.","needs":[],"forbid":[],"orPrev":false},{"text":"After a while the pounding stops. You hear him going down, a step at a time, and then nothing. Ames lets out a breath he seems to have been holding since noon. Light lies across the sea in a long white road.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[{"label":"Turn back to the glass","to":"p_ship_check","needs":[],"forbid":[]}]},{"id":"p_ship_check","name":"Ship check","heading":"","ending":false,"valence":"","blocks":[{"text":"You stand at the glass. The beam sweeps the water in long slow strokes and the fog glows white around it. Out in the gray, the ship’s horn sounds, nearer, nearer, and then stops, as if the whole sea were holding its breath.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[{"label":"Wait for the ship to answer","to":"p_end_good","needs":["i_dark"],"forbid":[]},{"label":"Wait for the ship to answer","to":"p_end_two_lights","needs":[],"forbid":["i_dark"]}]},{"id":"p_end_good","name":"End good","heading":"The Light Holds","ending":true,"valence":"good","blocks":[{"text":"The horn sounds again, and this time it is farther off, turning away from the rocks. The great lamp throws its long white arm across the water, and the only other light on this coast, the false one on the cliff, is dark. The ship has nothing to follow but the truth.","needs":[],"forbid":[],"orPrev":false},{"text":"Pell is picked up by a fishing smack the next afternoon, forty miles down the coast, cold and sullen and still sitting in the boat you cut loose.","needs":["i_pell"],"forbid":[],"orPrev":false},{"text":"Pell is gone before dawn. The hammering on the door stopped sometime around two, and the rowboat below the cliff went out with the tide. He will turn up somewhere else with the same sort of plan.","needs":["i_barred"],"forbid":["i_pell"],"orPrev":true},{"text":"By morning Ames is wrapped in a blanket beside the stove, refusing broth. The next supply boat finds a lit lighthouse and a story it does not quite believe.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[]},{"id":"p_end_two_lights","name":"End two lights","heading":"Two Lights","ending":true,"valence":"good","blocks":[{"text":"Out on the cliff the false lamp still burns, and above it the great lamp burns too. From the ship’s bridge there are two lights where there should be one, and for a long, bad hour nobody aboard can say which to trust.","needs":[],"forbid":[],"orPrev":false},{"text":"In the end the swell decides. The ship swings, and scrapes along the reef, and sits there groaning with her keel half open. By dawn every soul aboard is in a lifeboat and rowing for your rock, cold and furious and alive. The ship does not get off so lightly.","needs":[],"forbid":[],"orPrev":false},{"text":"Pell’s lamp is still burning on its pole when the sun comes up. You will think for a long time about how easily you could have reached it.","needs":["i_pell"],"forbid":[],"orPrev":false},{"text":"Pell and his boat are gone before the first lifeboat touches the rock. His lamp is still burning on its pole. You will think for a long time about how easily you could have reached it.","needs":[],"forbid":[],"orPrev":true}],"gives":[],"takes":[],"choices":[]},{"id":"p_end_signal","name":"End signal","heading":"A Small Light","ending":true,"valence":"good","blocks":[{"text":"You swing the lantern in wide arcs over the balcony rail. It is a poor, flickering thing beside the great lamp that is not lit, but the ship’s lookout sees it.","needs":[],"forbid":[],"orPrev":false},{"text":"The horn stops. The ship stands off until dawn. In the morning Ames lights the great lamp himself. The ship is long gone, and nobody needs it, but he lights it anyway, and he does it well.","needs":["i_dark"],"forbid":[],"orPrev":false},{"text":"He sees your lantern, and then he sees the other light, the steady one on the cliff, and the ship makes for the steady one. A small light cannot argue with a bright one. The grinding sound that follows goes on for a long time.","needs":[],"forbid":[],"orPrev":true}],"gives":[],"takes":[],"choices":[]},{"id":"p_end_flare","name":"End flare","heading":"Red Over Gull Rock","ending":true,"valence":"good","blocks":[{"text":"You lean out over the balcony rail and fire the flare. It goes up with a crack like a snapped board and hangs above the sea, red and wide and furious. Everyone in the world understands a red flare.","needs":[],"forbid":[],"orPrev":false},{"text":"The ship’s horn stops. For ninety seconds the whole reef stands out in the red light, black teeth in white foam, and then the ship begins, slowly, to turn away.","needs":[],"forbid":[],"orPrev":false},{"text":"Out in the fog, where the tide carried him, Pell sees the flare too, and knows what it means. A smack picks him up two days later, and he is not in a talking mood.","needs":["i_pell"],"forbid":[],"orPrev":false},{"text":"On the cliff, Pell sees the flare and knows the game is over. By the time the cutter arrives, the rowboat is gone and so is he.","needs":[],"forbid":[],"orPrev":true},{"text":"The great lamp stays dark until morning, when Ames lights it himself, long after anyone needed it, and he does it well.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[]},{"id":"p_end_sleep","name":"End sleep","heading":"Fog Over Gull Rock","ending":true,"valence":"bad","blocks":[{"text":"You sit on the cold floor and close your eyes for a moment. The horn sounds once. Then comes a long grinding sound from the rocks, and then only waves.","needs":[],"forbid":[],"orPrev":false},{"text":"In the morning the keeper finds you where you sat. The men with the boat are long gone. You never quite forgive yourself.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[]},{"id":"p_end_taken","name":"End taken","heading":"The Dark Coast","ending":true,"valence":"bad","blocks":[{"text":"The door bursts in, and Pell is on you before you have finished turning. You are not a fighting person, and the bar is still hanging on its hooks.","needs":[],"forbid":[],"orPrev":false},{"text":"The lamp has burned perhaps four minutes. That is long enough for the ship to see it, and not long enough to matter. Pell puts it out with his hat and sits you in a corner with your own belt around your wrists. The horn sounds once more, much too close, and then there is a long grinding sound from the rocks.","needs":[],"forbid":[],"orPrev":false},{"text":"At dawn the sea is full of timber, and Pell, who is not a greedy man, takes only what he can carry. Far below you, patient as a clock, the keeper goes on knocking.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[]},{"id":"p_end_bought","name":"End bought","heading":"A Share in the Wreck","ending":true,"valence":"bad","blocks":[{"text":"Pell’s hand is warm and dry, and the coins in it are cold. “Good,” he says. “Sit in the hall. Drink the old man’s tea. You were never here.”","needs":[],"forbid":[],"orPrev":false},{"text":"You sit in the keeper’s hall and you drink his tea. At midnight you hear the ship’s horn, nearer, and then a long grinding sound, and then voices a long way off that are not talking, exactly. You do not go to the window.","needs":[],"forbid":[],"orPrev":false},{"text":"At dawn Ames, whom you cut loose yourself, stands in the hall doorway. He looks at your hands, and then at your face, and says nothing to you, then or ever.","needs":["i_key"],"forbid":[],"orPrev":false},{"text":"In the morning you go down to the cellar. The keeper looks up at you for a long time and says nothing, then or ever.","needs":[],"forbid":[],"orPrev":true},{"text":"The money is real. It spends well. In the years afterward you are never short, and you never again sleep with a window open.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[]},{"id":"p_end_flee","name":"End flee","heading":"The Quiet Way Out","ending":true,"valence":"bad","blocks":[{"text":"You loose the rope, ease the boat off the post, and take the oars. The tide does half the work. Behind you the rock disappears into the fog, and the lamp that was never lit goes with it.","needs":[],"forbid":[],"orPrev":false},{"text":"You think, once, of the pole on the cliff standing dark, and wonder whether that was enough.","needs":["i_dark"],"forbid":[],"orPrev":false},{"text":"You do not look back.","needs":[],"forbid":[],"orPrev":true},{"text":"Hours later a distant boom rolls across the water, and then nothing at all. You never find out whose ship it was.","needs":[],"forbid":[],"orPrev":false}],"gives":[],"takes":[],"choices":[]}]}
</script>

: {pen} Write to build pages, {mapi} Map to see the shape, {items} Items for objects and states, Check to find problems, {play} Play to try it, then Export game."]),s("The Write tab, top to bottom",["Getting around: Ctrl+K (or Go to\u2026 above the page list) jumps to any page by typing part of its name. Choosing where a choice leads works the same way: click the page name on the choice, type, press Enter. Go \u203A opens that page and \u2039 \u203A at the top step back and forward through the pages you have been on. \u201CFrom\u201D shows which pages lead to this one. The panel buttons at the top of each side list hide it to give the writing more room.","Quicker writing: click an item in the right-hand list to put it in the open page\u2019s Gets box, Shift+click for Loses. Paste a scene whose choice lines start with -, \u2022 or > and they become choices. Ctrl+Shift+Enter in a paragraph splits the page at the cursor. Drag the \u22EE\u22EE grip to reorder choices and paragraphs (or press Alt+\u2191 or Alt+\u2193 inside one). \u201CNext to write\u201D opens the next empty page. Options holds smart quotes and the writing text size.","Find (Ctrl+Shift+F, or Find\u2026 above the page list) searches every page name, heading, paragraph, choice and \u201Cwhy locked\u201D text, with Match case and Whole words. Go jumps to a match; Replace changes one; Replace all (N) changes them all and Undo puts them back. The bookmark button on a page marks it unfinished; unfinished pages are listed on the Check tab.","The page name (only you see it) and an optional big heading, then the flag {flag} to make it the first page, {play} to play from here, and \u22EF for more.","Next, on one line when there is room: the page type (page, ending, good ending, bad ending) and two boxes for what happens when the player arrives: Gets and Loses. Their colors are not wins or losses; losing an item is not a losing ending.","Then Text and Choices. The + buttons add a paragraph, an alternative text or a choice. In a choice, Enter starts the next one; Ctrl+Enter (Cmd+Enter on a Mac) jumps to the page it leads to, making it if needed.","Each choice has \u201Cif\u201D: show it only when the player has, or lacks, something. With Write\u2019s advanced features on, it also has {items}: picking it gives or takes an object or state on the spot, without a new page.","Anything the checker finds on this page is listed under the page name. The strip at the bottom shows which pages lead here."]),s("Fewest clicks",["Drag a page from the left list onto a choice to link it, or anywhere in Choices to add a choice that leads there.","Drag a page onto \u201CReached from\u201D to make that page lead here (a new choice with no words yet; the checker reminds you).","Drag an item from the right list onto a paragraph or choice to show it only when the player has it, or into Gets or Loses.","Right-click a page, in the list or on the map, for quick actions; on a phone or tablet press and hold. \u201C+ New page\u2026\u201D and \u201CNew object\u2026\u201D in any menu make one on the spot."]),s("Objects and states",["An object {gift} is something the player carries or can hand over: a key, a wallet, a lantern. A state {heart} is something the player is: sick, brave, exhausted.","Both can show or hide text and choices (the \u201Cif\u201D button), and be gained or lost on a page (Gets, Loses) or, with Write\u2019s advanced features on, on a choice ({items}). (Hands over, which remembered where an object went, is hidden for now; stories that use it still work.)","The Items tab lists each on a line: rename it, switch its kind, and choose whether the player sees it (Show). New ones are shown, on the \u201CCarrying\u201D or \u201CFeeling\u201D line; switch Show off for secret ones, which still work.","A choice can lead back to its own page (\u201Cstay on this page\u201D) and give something, such as \u201CGrab the spare keys\u201D; add the key under \u201CNot if\u201D so the choice disappears once taken."]),s("Numbers, dice checks and locked choices",["A number {meter} is a score the player has: Courage, Money, Trust. Add one on the Items tab with \u201C+ New number\u201D; you choose its lowest and highest value and what it starts at. Players see it as a bar (switch Show off to keep it secret).","Pages and choices can add to or subtract from a number (\u201C\xB1 Numbers\u201D). A choice or paragraph can need a number: \u201CCourage 5 or more\u201D appears among the \u201Cif\u201D choices, and you can type the 5.","A dice check {dice} makes a choice a gamble: the game rolls 2 dice, adds the chosen number, and compares it with your target. If it falls short, the player goes to the page you pick for failing, so a failed roll still moves the story forward. The line under the choice shows the odds.","A locked choice: on a choice with an \u201Cif\u201D, tick \u201CShow greyed out\u201D and the player sees it, dimmed, with your reason (\u201CYou need a key\u201D). Without it, the choice stays hidden until it applies.","The checker counts every number, roll and locked choice: it tells you about checks that can never fail or never pass, and about thresholds the player can never reach."]),s("Givens: who the player is",["A Given {givens} is a question the player answers before page one, such as \u201CWho are you?\u201D with Man, Woman and They. Add one on the Items tab with \u201C+ New Given\u201D.","Each answer is a state that never changes. Use it like any state: drag it onto a paragraph or choice, or pick it in an \u201COnly if\u201D box. Write two paragraphs (\u201COnly if Woman\u201D, then \u201COtherwise\u201D) for text that differs.","On the Items tab, \u201CShown as\u2026\u201D gives an item another name for some players: the wallet becomes a purse for players who answered Woman.","On the Play tab you can answer the Givens once for testing, or be asked each time. Every ending\u2019s recap starts with the answers."]),s("Simple or advanced",["Options \u2192 Advanced turns each tab\u2019s advanced features on or off. With all four off, the editor shows only the essentials: pages, choices, objects and states, and a simple map.","Write: choices that give or take an object or state the moment they are picked ({items} on each choice).","Items: Givens {givens}, the questions a player answers before page one, and \u201CShown as\u201D names.","Items: also Numbers {meter} (health, courage, money) and the dice checks that use them. Game: adds a Game tab, between Check and Play, for reader options in exported games (Back button rules, endings found, a Place code, the Aa button, odds, colors) with a live preview of your own story; the tab shows while the switch is on.","Map: the Choke-point spine, Given lanes, Story shape, River of players and Arc views; coloring by ending odds, playtest heat or one item; drawing the map for one Given answer; and Playtest results. Flow, Top-down tree and Matrix are always there.","Turning a feature off only hides it: a story that already uses it keeps working, and the Check tab says so under Good to know. Until you choose for yourself, opening a story that uses an advanced feature turns it on. Your Advanced choices are always kept in this browser."]),s("The Map: views",["Flow: left to right, one column per choice from the start. Top-down tree: the same, falling down the page.","(Advanced) Choke-point spine: the pages every route to the goal must pass through sit on one bold line, with branches above and below.","(Advanced) Given lanes: one band per Given answer, so each kind of player\u2019s road shows side by side; pages every player can reach are in the middle band.","(Advanced) Story shape: your story squeezed to its backbone. Circles are pages every player passes through; each capsule between two of them is a stretch of story, its pages shown as dots (green and red for good and bad endings), labeled with how it is built (a straight road, branch and rejoin, endings off it, a loop). Click a capsule to see its pages in Flow, or a dot to edit that page.","(Advanced) River of players: simulated players pour through the story; the wider a band, the more of them take that choice. Click a band to follow just those players to how they ended, or a page to trace everyone who saw it (where they came from, where they went). The panel on the right gives the numbers; Esc clears. Choose how many players there are and how they pick (at random, always the first choice, or exploring new pages), and use \u201CAs:\u201D to watch only players with one Given answer.","(Advanced) Arc diagram: every page on one line in reading order; choices are arcs above it. Long jumps and loops stand out.","Matrix: read across a row; a square in a column means that row\u2019s page leads to that column\u2019s page (a number: several choices). Squares right of the diagonal go forward, red ones go back, and blocks near the diagonal are pages that link to each other. Click a square to change its choice."]),s("The Map: tools",["Pages that simply follow one another (one way in, one way out) fold into one box. Click it to open it; an opened run shows a Fold card to close it again. (Advanced) \u201CAs:\u201D draws the map as a player who gave that Given answer sees it, and Playtest results shows what simulated players do.","Merge (on unless you switch it off) draws several choices between the same two pages as one arrow marked \xD72, \xD73; right-click it to edit each. Arc, Matrix and River always merge. Size draws a page bigger the larger the share of routes through it (a folded run takes its busiest page) and outlines choke points in bold.","(Advanced) Color: ending odds tints each page green where most simulated players go on to end well and red where most end badly; playtest heat deepens with how many see it and grays pages almost nobody reaches; \u201CTrack: \u2026\u201D follows one object or state, outlining where it is given (green), needed (blue) and taken (red). With either playtest color, the bar above the map shows the players\u2019 results; \u201CFull results\u201D lists where they end, the most-seen and rarely-seen pages, and where they get stuck.","The toolbar is all small icons: hover or long-press one for its name and what it does. A lit icon is on.","Hover a page (or tap it once) to light up the pages that lead to it and on from it; click (or tap again) to edit it; Esc clears. Search lights matching pages; Good path and Bad path show the shortest route to each good or bad ending.","Arrows: solid is a choice, dashed appears only sometimes (it needs or is blocked by something). A badge {gift} {heart} in the middle of an arrow means picking it gives (or, faded, takes) something. A dotted page is a side page: on no shortest route to a good or bad ending.","The score beside the paths counts crossing arrows and arrows pointing backwards. Click it to compare every view on crossings, neighbors, groups, stability, flow, compactness and speed, weighed for three tasks. The same story always draws the same way, so editing does not reshuffle your map, and Undo puts pages back.","Build from the map: right-click a page to add a choice, change its type, give or take items, rename, duplicate, delete or play from there; an arrow to change its words, where it leads and when it appears. Double-click empty space to add a page."]),s("The Check tab",["Unfinished pages lists the pages you bookmarked. In the map\u2019s advanced mode, Pages nobody reached lists pages none of the simulated players saw; Why? explains in plain words what blocks each one. The same question is in a page\u2019s \u22EF menu: \u201CWhy can\u2019t players reach this page?\u201D","It plays every way a player could move through your story, with every combination of items and Given answers, using the game\u2019s own rules.","Problems stop players: a choice that leads nowhere, a dead end, a page nobody can reach, a place where every choice is hidden, or a loop with no way out.","Things to look at are probably mistakes: missing words, text or choices that can never appear (and why), two identical choices shown together, two pages or items with the same name, a choice that needs and hides on the same item, a leftover TODO, an empty paragraph, items that are unused, change nothing or can never be got.","Good to know (folded) is not a mistake: a story still called \u201CUntitled story\u201D, a page that is very long or has more than seven choices, repeated words, mixed straight and curly quotes, optional choices a player can miss for good, items given or taken where it makes no difference, a story with no good ending yet.","(Map advanced) Story shape names what your story is built like (time cave, branch and bottleneck, parallel tracks, hub and spokes, gauntlet) and gives one tip. Pacing shows the shortest, usual and longest read in minutes, from the words per minute you set. Each ending has an explorer: how many situations lead there, what the player must have, and a button to play from just before it.","Play \u2192 \u201CTest from\u2026\u201D starts a test at a page you choose, already holding what a player would have there, so you can try a late scene without replaying the start."]),s("What players see",["Games have a Back button only if you pick a rule (Game tab, Game switch on): remember the dice, roll again, or never back past a roll. Players keep their place in their browser.","The Aa button lets a player make text bigger, spacing wider, contrast higher, motion calmer and numbers plainer. It is on by default and saved on their device. \u201CForget found endings\u201D clears the count of endings.","Color presets: Paper (light, dark by the device), Night, Sepia, Ocean, Forest and High contrast. Each is checked for readable contrast. Number keys 1 to 9 pick a choice."]),s("Saving, exporting, privacy",["File \u2192 Save manuscript (.md) writes all the words of the story, page by page with each choice and where it leads, as one text file for proofreading in another program. It has no rules and cannot be loaded back.","Your story is kept in this browser as you work. Nothing is ever sent over the internet; the editor works fully offline.","{save} Save (or Ctrl+S) writes your story to a .story.json file: the first time you choose where, then it saves straight there. An orange dot means unsaved changes. File \u2192 Save as\u2026 picks a new file. (Firefox and Safari download a copy instead.) To move a story to another device, open that file there.","Export game saves one small HTML file anyone can open, online or offline: about 44 KB for a 25-page story, or about 27 KB if you check \u201CUse system font\u201D (in the export window, or Options \u2192 Use system font - Export). That setting is saved with the story. A game carries only what its story uses: no dice, number bars, greyed-out choices, Back button, endings count or Given questions code unless the story has them, and only the color preset you chose.","Every ending offers Play again and, folded underneath, a recap of the path the player took. A player\u2019s place is kept in their browser, so they can come back later."]),s("Look, keys and phones",["Options (\u2699 beside Save) holds the quick guide, keyboard shortcuts and light / dark (the Play tab follows it). It also switches games from this story, or the editor itself, to the system font (Use system font - Export, Use system font - Editor) instead of the built-in Inter Tight, and turns remembering your preferences in this browser on or off. Options \u2192 Speed report records how smoothly the editor runs on your device, with an \u201CIt stuttered!\u201D button, and gives a report to paste into the chat (adding #report to the address starts it at once).","Options \u2192 Keyboard shortcuts lists every shortcut. Arrow keys move between the tabs. Click the logo at the top left to see the opening again.","On a phone, the Pages and Items buttons open the side lists, and the map\u2019s tools scroll sideways in one row. Every drag has a menu equivalent."])).forEach(m=>l.appendChild(m));l.appendChild(a("div",{class:"row end"},[a("button",{class:"btn",type:"button",text:"Keyboard shortcuts",onclick(){u();ki()}}),a("button",{class:"btn primary",type:"button",text:"Got it",onclick:u})]))})}const wl=[["write","Write","Write pages, choices and what players gain or lose"],["map","Map","See the whole story as a map"],["items","Items","Rename objects and states"],["check","Check","Find places where players could get stuck"],["game","Game","Choose how exported games look and behave, and see the colors on your own story"],["play","Play","Try the story as a player"]];function xi(e){const n=`show-${e}`;const s=!document.body.classList.contains(n);An();if(s)document.body.classList.add(n)}function An(){document.body.classList.remove("show-side","show-items")}function xn(){const e=V("#title");if(e&&document.activeElement!==e)e.value=o.title;V("#undo").disabled=!k.length;V("#redo").disabled=!y.length;const n=storyStats(o);const s=V("#stats");function l(g,S,C,A,B){return a("span",{class:"stat",title:A},[B||null,a("b",{text:g.toLocaleString()}),B?null:` ${g===1?S:C}`])}if(s){s.textContent="";[l(n.pages,"page","pages","Pages in the story"),l(n.items,"item","items","Objects and states"),n.givens?l(n.givens,"Given","Givens","Questions answered before the story starts"):null,l(n.choices,"choice","choices","Choices across all pages"),l(n.words,"word","words","Words a player can read: title, headings, text and choice labels. Page and item names are not counted."),l(n.good,"","","Good endings",Je("smile",14)),l(n.bad,"","","Bad endings",Je("frown",14))].forEach(g=>{if(g)s.appendChild(g)})}const u=V("#savebtn");if(u){const g=zt===null||b!==zt;u.classList.toggle("dirty",g);u.title=cn?g?`Save your changes to ${cn.name} (Ctrl+S)`:`Saved to ${cn.name}`:"Save your story to a file (Ctrl+S). The first time you choose where; after that it saves straight there."}const m=V("#tabs");m.textContent="";wl.filter(g=>g[0]!=="game"||
